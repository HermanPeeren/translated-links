PLG_TASK_TRANSLATEDLINKS="Task - Translated Links"
PLG_TASK_TRANSLATEDLINKS_XML_DESCRIPTION="Points the links in translated articles, category descriptions and custom modules at the pages in their own language. A translation keeps the links of its source, to the source language's menu items; this repoints each of them to the equivalent menu item, article or category in the translation's language."

PLG_TASK_TRANSLATEDLINKS_REPAIR_TITLE="Translated links: repair"
PLG_TASK_TRANSLATEDLINKS_REPAIR_DESC="Goes over every article, category description and custom module in a language of its own, and points its links to menu items, articles and categories in another language at their equivalents in its own language. Links whose equivalent does not exist yet are listed in the task log; run the task again once those menu items are made. Saves through each component's own model, so every change is in the version history. Dry run by default."

PLG_TASK_TRANSLATEDLINKS_FIELD_TIME_BUDGET_LABEL="Time per run (seconds)"
PLG_TASK_TRANSLATEDLINKS_FIELD_TIME_BUDGET_DESC="How long one run may work. When there is more to do, the task stops, and the scheduler runs it again straight away to continue where it stopped."
PLG_TASK_TRANSLATEDLINKS_FIELD_DRY_RUN_LABEL="Dry run"
PLG_TASK_TRANSLATEDLINKS_FIELD_DRY_RUN_DESC="Log what would change, without saving anything. Switch this off to repair."
PLG_TASK_TRANSLATEDLINKS_FIELD_AS_USER_LABEL="Record changes as"
PLG_TASK_TRANSLATEDLINKS_FIELD_AS_USER_DESC="The user shown as 'Modified by' and in the version history of repaired items. A dedicated user, such as 'Link repair', makes the changes easy to recognise."

PLG_TASK_TRANSLATEDLINKS_LOG_FAILED="Repair of translated links stopped: %s"
